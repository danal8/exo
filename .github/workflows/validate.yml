name: Validate guide
on:
  push:
    branches: [main]
    paths: ['*.js', '*.mjs', 'scripts/**', 'tests/**', '.github/workflows/validate.yml']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
