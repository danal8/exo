name: Discover new signed reviews
on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/reviews.mjs', 'scripts/refresh-reviews.mjs', '.github/workflows/refresh-reviews.yml']
permissions:
  contents: write
concurrency:
  group: review-discovery
  cancel-in-progress: false
jobs:
  reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/reviews.test.mjs
      - run: node scripts/refresh-reviews.mjs
      - name: Publish newly discovered reviews
        run: |
          git config user.name "exo reviews"
          git config user.email "actions@users.noreply.github.com"
          git add data/reviews.json data/reviews-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Discover signed reviews and record production matching evidence"
          git pull --rebase origin main
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-discovery-report
          path: data/reviews-report.json
